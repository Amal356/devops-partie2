---
- name: Installer Docker Engine, Compose v2 et le SDK Python
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - python3-docker
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Demarrer et activer Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ajouter devops au groupe docker
  ansible.builtin.user:
    name: devops
    groups: docker
    append: true

- name: Creer le volume de Portainer
  community.docker.docker_volume:
    name: portainer_data

- name: Lancer Portainer CE
  community.docker.docker_container:
    name: portainer
    image: portainer/portainer-ce:lts
    restart_policy: unless-stopped
    published_ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
